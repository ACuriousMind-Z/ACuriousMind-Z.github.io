# overrides.yml -- hand-maintained.
#
# Classifies every citation key in publications.bib (keyed by DOI where the
# entry has one, otherwise by its manual.bib citation key) into a CV
# section, an optional status label, and a sort value used to order entries
# within a section (higher sorts first). Anything in publications.bib that
# is NOT listed here falls back to `defaults` and render.py will print a
# warning so new ORCID entries get classified instead of silently
# defaulting.
#
# Sections: first_author, coauthored, conference, patent, thesis.
#
# `site: false` keeps an entry out of _data/publications.yml (the site's
# public publication list) while still including it in the CV -- used here
# for the three not-yet-submitted manuscripts, matching how they were
# already commented out of _data/publications.yml before this pipeline
# existed. Omit `site` (or set it true) to show the entry on both.
#
# `conference_short` and `pdf` are optional site-only fields (see
# _includes/publications.md) that ORCID/Crossref cannot supply reliably;
# set them here per entry to control the badge text and PDF link.

defaults:
  section: coauthored
  site: true

entries:
  # --- First-authored ------------------------------------------------------
  zhaoinprepadfm:
    section: first_author
    status: "To be submitted"
    site: false
    sort: 2027.0
