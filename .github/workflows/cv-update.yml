name: CV update

# Keeps cv/publications.bib, cv/publications.tex, _data/publications.yml, and
# _data/orcid.yml synchronized from ORCID/Crossref, and republishes the
# compiled CV PDF. See cv/README.md for the data flow and the maintenance
# runbooks (in particular, what to do when an in-preparation work is
# published and acquires a DOI).
#
# This repo's GitHub Pages site is *not* built by a workflow in this repo
# (there is no other file under .github/workflows/), so it uses GitHub's
# classic "deploy from a branch" Pages build, which is triggered by GitHub
# itself on every push to the Pages source branch and is entirely separate
# from Actions. Nothing here can race or interfere with it. The push
# trigger below is scoped to cv/** so unrelated commits don't run this
# workflow at all.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  push:
    branches: [main]
    paths:
      - "cv/**"
  workflow_dispatch: {}

concurrency:
  group: cv-update
  cancel-in-progress: false

jobs:
  # Fetches ORCID/Crossref, regenerates the four tracked artifacts, and
  # opens a PR if anything changed. Never commits to main directly, so a
  # human reviews what ORCID contributed before it reaches the CV or site.
  sync-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r cv/requirements.txt

      - name: Fetch ORCID + Crossref
        run: python3 cv/scripts/fetch_orcid.py

      - name: Fetch ORCID biography
        run: python3 cv/scripts/fetch_orcid_profile.py

      - name: Render CV + site publication list
        run: python3 cv/scripts/render.py

      # fetch_orcid.py writes cv/.cache/sync-report.md when it spots a
      # Crossref entry that looks like an existing manual.bib entry -- the
      # signature of an in-preparation work having been published. Folding it
      # into the PR body puts the warning where the reviewer actually looks,
      # rather than only in the job log.
      - name: Compose PR body
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<'PRBODY'
          Automated sync from the ORCID public API + Crossref
          (`cv/scripts/fetch_orcid.py`, `cv/scripts/fetch_orcid_profile.py`,
          `cv/scripts/render.py`).

          Review the diff before merging:

          - Entries new to ORCID need a `cv/overrides.yml` row, keyed by
            **DOI**, if the workflow log warned that one is unclassified.
          - A change to `_data/orcid.yml` rewrites the About Me text on
            jxzhao.com.
          PRBODY
          if [ -s cv/.cache/sync-report.md ]; then
            printf '\n' >> "$RUNNER_TEMP/pr-body.md"
            cat cv/.cache/sync-report.md >> "$RUNNER_TEMP/pr-body.md"
          fi
          echo "--- composed PR body ---"
          cat "$RUNNER_TEMP/pr-body.md"

      - name: Open PR with any changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "cv: sync publications from ORCID/Crossref"
          branch: cv/orcid-sync
          delete-branch: true
          title: "CV: sync publications from ORCID"
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            cv/publications.bib
            cv/publications.tex
            _data/publications.yml
            _data/orcid.yml

  # Compiles cv.tex from whatever is already on main (i.e. previously
  # reviewed/merged content -- not the possibly-still-open PR above) and
  # publishes it as a release asset at a stable URL.
  build-and-release-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern latexmk

      - name: Compile CV PDF
        run: make -C cv pdf

      - name: Publish cv.pdf as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cv-latest
          name: "Latest CV"
          body: "Automatically rebuilt from cv/cv.tex on every push to cv/** (and weekly). Stable download link -- always the current cv.pdf."
          files: cv/cv.pdf
